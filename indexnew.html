<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortarheadd Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #111111;
            color: #ffffff;
            font-family: 'Titillium Web', sans-serif;
            overflow: hidden;
        }

        .gateway-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. 핵심 레이아웃: CSS Grid */
        .main-content {
            display: grid;
            grid-template-columns: 1fr auto 1fr; /* 좌측 여백 | 중앙 버튼 | 우측 여백 */
            gap: 40px; 
            width: 100%;
            max-width: 1440px;
            padding: 0 40px;
            align-items: center;
        }

        .text-wrapper {
            display: flex;
        }
        .text-left-wrapper {
            justify-content: flex-end;
        }
        .text-right-wrapper {
            justify-content: flex-start;
        }

        /* 유동적 폰트 타이포그래피 (1800px 이하부터 부드럽게 축소) */
        .brand-text {
            /* clamp(최소 크기, 유동 크기, 최대 크기) 적용 */
            font-size: clamp(42px, 4.7vw, 85px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            line-height: 0;
            white-space: nowrap;
        }

        .char {
            display: inline-block;
            opacity: 0; 
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
        }

        .button-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 24px;
            background-color: #111111;
            z-index: 10;
        }

        .enter-link {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.02em;
            padding: 8px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn-without {
            border-radius: 0px;
        }
        .btn-without:hover{
            color : #3b43fc;
        }
        .btn-without::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 14px;
            right: 14px;
            height: 1px;
            background-color: #3b43fc;
            /* 1. 처음에는 밑줄이 보이지 않도록 scaleX를 0으로 설정 */
            transform: scaleX(0); 
            /* 2. 글을 읽는 방향인 왼쪽에서부터 선이 그려지도록 기준점 수정 */
            transform-origin: left center; 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .btn-without:hover::after {
            /* 3. 롤오버 시 밑줄이 나타나도록 scaleX를 1로 설정 */
            transform: scaleX(1); 
        }

        .btn-with {
            background-color: #ffffff;
            color: #000000;
            border-radius: 0px;
            padding: 2px 16px; /* 효과를 위해 좌우 여백 세팅 */
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); /* 쫀득한 텐션의 이징 함수 */
        }
        
        /* ↵ 기호 초기 세팅 (숨김 & 우측으로 밀어둠) */
        .btn-with::after {
            content: '↵';
            position: absolute;
            right: 6px;
            top: 50%;
            opacity: 0;
            transform: translateY(-50%) translateX(10px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            font-weight: 900;
        }

        .btn-with:hover {
            background-color: #bfff00;
            text-decoration: none;
            /* 텍스트를 왼쪽으로 6px 밀어내기 (좌측 패딩은 줄이고, 우측 패딩은 늘림) -> 버튼 전체 크기는 불변! */
            padding-left: 10px;
            padding-right: 22px; 
        }

        .btn-with:hover::after {
            opacity: 1;
            /* 기호가 등장하며 원래 자리로 */
            transform: translateY(-50%) translateX(0);
        }

        .footer-consent {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            text-transform: uppercase;
            line-height: 1.5;
            white-space: nowrap;
        }

        /* ==========================================================================
           태블릿 & 모바일 반응형: 여백 확보 및 폰트 유연성 강화
           ========================================================================== */
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: auto auto; 
                justify-content: center; 
                grid-template-rows: auto auto;
                gap: 15px 0px; 
                /* [해결 포인트 1] 명확한 양옆 여백 강제 할당 */
                padding: 0 40px; 
            }

            .brand-text {
                /* [해결 포인트 2] 모바일에서 단어가 여백을 밀어내지 않도록 최소 크기를 20px까지 대폭 하향 */
                font-size: clamp(36px, 6.5vw, 42px); 
            }

            .btn-container {
                grid-column: 1 / span 2; 
                grid-row: 2; 
                margin-top: 30px; 
                justify-self: center; 
                width: 100%; 
            }

            .button-box {
                width: 100%;
                max-width: 480px;
                padding: 10px 16px; /* 버튼 상자 여백 최적화 */
                gap: 15px;
            }

            .enter-link {
                font-size: 13px;
                padding: 2px 16px;
            }

            .footer-consent {
                bottom: 30px;
                width: 90%;
                white-space: normal;
            }
        }

        /* 480px 이하 좁은 모바일 화면 (아이폰 미니, SE 등) 디테일 제어 */
        @media (max-width: 480px) {
            .main-content {
                padding: 0 24px; /* 아주 좁은 화면에서는 여백을 살짝 타이트하게 */
                gap: 12px 10px;
            }
            .brand-text {
                font-size: clamp(22px, 8vw, 32px); 
            }
            .button-box {
                flex-direction: row; /* 버튼을 가로로 유지 */
                padding: 10px 16px;
                gap: 8px;
            }
            .enter-link {
                font-size: 11px; /* 텍스트가 겹치지 않게 버튼 폰트 축소 */
                padding: 4px 6px;
            }
        }
    </style>
</head>
<body>

    <div class="gateway-wrapper">
        <div class="main-content">
            <div class="text-wrapper text-left-wrapper">
                <div class="brand-text" id="text-left">/Mortar</div>
            </div>

            <div class="btn-container">
                <div class="button-box" id="btn-box">
                <!--<a href="./creative_test2.html" class="enter-link btn-without">Enter to creative</a>-->
                    <a href="./creative_test2.html" class="enter-link btn-with">CREATIVE</a>
                    <a href="./marketing.html" class="enter-link btn-without">MARKETING</a>
                </div>
            </div>

            <div class="text-wrapper text-right-wrapper">
                <div class="brand-text" id="text-right">Headd]</div>
            </div>
        </div>

        <div class="footer-consent">
            Mortarheadd is a powerhouse of raw creativity<br />
            and sharp marketing insight.
        </div>
    </div>

    <script>
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function prepareText(elementId) {
            const el = document.getElementById(elementId);
            const text = el.textContent.trim();
            el.innerHTML = '';
            
            const chars = [];
            for (let char of text) {
                const span = document.createElement('span');
                span.className = 'char';
                span.textContent = char;
                el.appendChild(span);
                chars.push(span);
            }
            return chars;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const leftChars = prepareText('text-left');
            const rightChars = prepareText('text-right');
            const allChars = shuffle([...leftChars, ...rightChars]);

            let mm = gsap.matchMedia();

            mm.add({
                isDesktop: "(min-width: 901px)",
                isMobile: "(max-width: 900px)"
            }, (context) => {
                let { isDesktop } = context.conditions;
                
                gsap.set(allChars, { opacity: 0 });
                gsap.set('.btn-container', { opacity: 0, pointerEvents: 'none' });

                const tl = gsap.timeline();

                // 1단계: 알파벳 랜덤 등장 (공통)
                tl.to(allChars, {
                    opacity: 1,
                    duration: 0.6,
                    stagger: 0.04,
                    ease: "power2.inOut"
                });

                if (isDesktop) {
                    // PC, 태블릿: 중앙에서 분리되는 애니메이션
                    tl.fromTo('#text-left', 
                        { x: 180 }, 
                        { x: 0, duration: 1.2, ease: "power4.inOut" }, 
                        "+=0.2"
                    );
                    tl.fromTo('#text-right', 
                        { x: -180 }, 
                        { x: 0, duration: 1.2, ease: "power4.inOut" }, 
                        "<"
                    );
                } else {
                    // 모바일: 분리 애니메이션 없이 정가운데 고정된 상태로 약간의 대기 시간만 가짐
                    tl.set({}, {}, "+=0.2");
                }

                // 3단계: 버튼 박스 Fade In
                // 모바일은 텍스트 분리 애니메이션이 없으므로 타이밍을 조금 더 앞당김 (-=0.2)
                tl.to('.btn-container', {
                    opacity: 1,
                    duration: 0.8,
                    ease: "power2.out",
                    onComplete: () => {
                        document.querySelector('.btn-container').style.pointerEvents = 'auto';
                    }
                }, isDesktop ? "-=0.6" : "-=0.2");

                return () => {
                    gsap.set(['#text-left', '#text-right', '.btn-container', ...allChars], { clearProps: "all" });
                };
            });
        });
    </script>
</body>
</html>
