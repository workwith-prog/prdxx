<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KST Clock Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

  <style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 250px;
  height: 129px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

body {
  display: block;
  font-family: "BIZ UDPGothic", sans-serif;
}

.clock-wrap {
  position: absolute;
  left: 0;
  top: 0;
  width: 250px;
  height: 129px;
  display: block;
  margin: 0;
  padding: 0;
  background: transparent;
}

.clock-stage {
  position: relative;
  width: 250px;
  height: 100px;
  margin: 0;
  background: transparent;
}

.clock-bg {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 250px;
  height: 100px;
  object-fit: contain;
}

.clock-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: block;
  width: 250px;
  height: 100px;
  overflow: visible;
  pointer-events: none;
}

.hour-hand {
  stroke: #ffffff;
  stroke-width: 5;
  stroke-linecap: butt;
}

.minute-hand {
  stroke: #2424FF;
  stroke-width: 3;
  stroke-linecap: butt;
}

.second-hand {
  stroke: #F8FF73;
  stroke-width: 1;
  stroke-linecap: butt;
}

.digital-time {
  width: 250px;
  margin: 18px 0 0;
  color: #d7d7d7;
  font-family: "BIZ UDPGothic", sans-serif;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0;
  text-align: center;
  white-space: nowrap;
}

@media (max-width: 280px) {
  html,
  body {
    width: 100%;
    height: 100%;
  }

  .clock-wrap {
    transform: scale(calc((100vw - 24px) / 250));
    transform-origin: left top;
  }
}
  </style>
</head>

<body>
  <div class="clock-wrap">
    <div class="clock-stage">
      <img class="clock-bg" src="../images/creative/time.svg" alt="">

      <svg class="clock-overlay" viewBox="0 0 250 100" aria-hidden="true">
        <g id="clockFace" transform="translate(125 50)">
          <rect
            x="-6"
            y="-6"
            width="12"
            height="12"
            fill="#373737"
          />

          <g id="hourHandGroup">
            <line
              class="hour-hand"
              x1="0"
              y1="8"
              x2="0"
              y2="-35"
            />
          </g>

          <g id="minuteHandGroup">
            <line
              class="minute-hand"
              x1="0"
              y1="9"
              x2="0"
              y2="-60"
            />
          </g>

          <g id="secondHandGroup">
            <line
              class="second-hand"
              x1="0"
              y1="14"
              x2="0"
              y2="-65"
            />
          </g>
        </g>
      </svg>
    </div>

    <p class="digital-time" id="digitalTime">00:00:00 KST(UTC+9)</p>
  </div>

  <script>
    const hourHandGroup = document.querySelector("#hourHandGroup");
    const minuteHandGroup = document.querySelector("#minuteHandGroup");
    const secondHandGroup = document.querySelector("#secondHandGroup");
    const digitalTime = document.querySelector("#digitalTime");

    function getKstDate() {
      return new Date(new Date().toLocaleString("en-US", {
        timeZone: "Asia/Seoul"
      }));
    }

    function padTime(number) {
      return String(number).padStart(2, "0");
    }

    function updateClock() {
      const now = getKstDate();

      const hours24 = now.getHours();
      const hours = hours24 % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();

      const hourAngle = (hours + minutes / 60 + seconds / 3600) * 30;
      const minuteAngle = (minutes + seconds / 60) * 6;
      const secondAngle = (seconds + milliseconds / 1000) * 6;

      hourHandGroup.setAttribute("transform", `rotate(${hourAngle})`);
      minuteHandGroup.setAttribute("transform", `rotate(${minuteAngle})`);
      secondHandGroup.setAttribute("transform", `rotate(${secondAngle})`);

      digitalTime.textContent =
        `${padTime(hours24)}:${padTime(minutes)}:${padTime(seconds)} KST(UTC+9)`;

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
