<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sliding Panels 데모</title>
  <script type="module" src="sliding-panels.js"></script>
  <style>
    body { margin: 0; font: 16px/1.6 system-ui, -apple-system, sans-serif; background: #f4f4f5; color: #18181b; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #52525b; }
    sliding-panels { width: 100%; height: min(62vh, 560px); border-radius: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Sliding Panels</h1>
    <p>images/ 폴더의 이미지를 macOS 슬라이드 패널 화면보호기처럼 보여주는 영역입니다.</p>

    <sliding-panels folder="images/" interval="3500" gap="4"></sliding-panels>
  </main>
</body>
</html>
